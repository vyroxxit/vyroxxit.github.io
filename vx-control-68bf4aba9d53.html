<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0C1519">
<title>مركز التحكم · VYROXX IT</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script>try{var th=localStorage.getItem("vx-theme");if(th&&/^(light|dark|legend|hacker)$/.test(th))document.documentElement.setAttribute("data-theme",th);var lg=localStorage.getItem("vx-lang");if(lg&&/^(ar|en|fr|es)$/.test(lg)){document.documentElement.lang=lg;document.documentElement.dir=lg==="ar"?"rtl":"ltr"}}catch(e){}</script>
<style>
:root{--bg:#F1F4F3;--surface:#FFFFFF;--ink:#12263A;--muted:#52667A;--line:#D3DDDD;--accent:#0F8B8D;--on-accent:#FFFFFF;--hot:#D9482B;--ok:#1E9E6A;--warn:#B07400}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1519;--surface:#142228;--ink:#E6EFEF;--muted:#9BB1B5;--line:#24383E;--accent:#3CC4C4;--on-accent:#0C1519;--hot:#FF7A59;--ok:#3DDC84;--warn:#F5B83D;color-scheme:dark}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{--bg:#0C1519;--surface:#142228;--ink:#E6EFEF;--muted:#9BB1B5;--line:#24383E;--accent:#3CC4C4;--on-accent:#0C1519;--hot:#FF7A59;--ok:#3DDC84;--warn:#F5B83D;color-scheme:dark}
:root[data-theme="legend"]{--bg:#0B0716;--surface:#150E26;--ink:#F3E9D2;--muted:#BBAAD8;--line:#3A2A5E;--accent:#F5B83D;--on-accent:#1A1024;--hot:#FF6B94;--ok:#6FE3A5;--warn:#F5B83D;color-scheme:dark}
:root[data-theme="hacker"]{--bg:#000;--surface:#04100A;--ink:#B8FFC8;--muted:#4FC26E;--line:#0F5A24;--accent:#00FF41;--on-accent:#00170A;--hot:#FF2E63;--ok:#00FF41;--warn:#FFD400;color-scheme:dark}
:root[data-theme="legend"] body{background-image:radial-gradient(1100px 560px at 88% -8%,rgba(245,184,61,.15),transparent 60%),radial-gradient(900px 600px at 0% 25%,rgba(124,77,255,.24),transparent 60%);background-attachment:fixed}
:root[data-theme="legend"] .card,:root[data-theme="legend"] .plate{border-color:rgba(245,184,61,.38);box-shadow:0 0 22px rgba(124,77,255,.14)}
:root[data-theme="hacker"] body{background-image:repeating-linear-gradient(0deg,rgba(0,255,65,.05) 0 1px,transparent 1px 3px),radial-gradient(900px 500px at 50% -10%,rgba(0,255,65,.12),transparent 65%);background-attachment:fixed}
:root[data-theme="hacker"] .card,:root[data-theme="hacker"] .plate{border-color:rgba(0,255,65,.45);box-shadow:0 0 14px rgba(0,255,65,.14)}
:root[data-theme="hacker"] .card,:root[data-theme="hacker"] .plate,:root[data-theme="hacker"] .btn,:root[data-theme="hacker"] .hold,:root[data-theme="hacker"] textarea,:root[data-theme="hacker"] input[type=text],:root[data-theme="hacker"] select,:root[data-theme="hacker"] .seg{border-radius:4px}
:root[data-theme="hacker"] .btn.alt{border-color:var(--accent);color:var(--accent)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8;font-size:17px;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);background-image:radial-gradient(900px 480px at 85% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 62%);background-repeat:no-repeat}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{width:min(1020px,94%);margin:0 auto;padding:22px 0 120px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700}
.brand svg{width:34px;height:44px}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:14px;direction:ltr;text-align:start;letter-spacing:.08em}
.tb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;height:40px}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:0 12px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.theme{height:40px;min-width:44px;padding:0 12px;font-size:19px;line-height:1;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer}
.theme:hover{border-color:var(--accent)}
:root[data-theme="hacker"] .theme{border-radius:4px}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.who bdi{direction:ltr;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{font:inherit;font-weight:700;font-size:16px;border-radius:12px;padding:11px 22px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;transition:transform .15s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 14px;font-size:14px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:16px}
.card h2{margin:0 0 4px;font-size:20px}
.card p.sub{margin:0 0 14px;color:var(--muted);font-size:15px}
.note{color:var(--muted);font-size:14px}

/* status plate */
.plate{position:relative;overflow:hidden;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);padding:clamp(20px,3.5vw,32px);transition:border-color .4s,background .4s}
.plate::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(560px 240px at 100% 0%,color-mix(in srgb,var(--st) 22%,transparent),transparent 70%)}
[dir="ltr"] .plate::before{background:radial-gradient(560px 240px at 0% 0%,color-mix(in srgb,var(--st) 22%,transparent),transparent 70%)}
.plate>*{position:relative}
.plate[data-on="1"]{--st:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.plate[data-on="0"]{--st:var(--hot);border-color:var(--hot);background:color-mix(in srgb,var(--hot) 7%,var(--surface))}
.plate-main{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:center}
.state{display:flex;align-items:center;gap:14px}
.dot{flex:none;width:20px;height:20px;border-radius:50%;background:var(--st);box-shadow:0 0 0 6px color-mix(in srgb,var(--st) 25%,transparent)}
.plate[data-on="1"] .dot{animation:ping 2.4s infinite}
@keyframes ping{70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.stt{font-size:clamp(28px,5.5vw,44px);font-weight:700;line-height:1.15}
.meta{color:var(--muted);font-size:14.5px;margin-top:8px}
.meta bdi{direction:ltr;unicode-bidi:isolate}
.hold{position:relative;overflow:hidden;width:100%;min-height:68px;border-radius:16px;border:2px solid var(--st);background:transparent;color:var(--ink);font:inherit;font-size:18px;font-weight:700;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.hold i{position:absolute;inset:0;background:var(--st);transform:scaleX(0);transform-origin:right center}
[dir="ltr"] .hold i{transform-origin:left center}
.hold span{position:relative}
.hold.go i{transform:scaleX(1);transition:transform 1.1s linear}
.hold.go{color:#fff}
.hold:disabled{opacity:.55;cursor:wait}
.hint{margin:8px 0 0;text-align:center;color:var(--muted);font-size:13.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;border:1px solid var(--line);border-radius:99px;padding:3px 14px 3px 12px;background:var(--bg)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.chip[data-s="off"]{border-color:var(--hot);color:var(--hot)}
.chip[data-s="off"] i{background:var(--hot)}
.chip[data-s="info"] i{background:var(--accent)}
.chip[data-s="idle"] i{background:var(--line)}

/* rows & switches */
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.row.first{border-top:0;padding-top:0}
.row b{display:block}
.row span.d{color:var(--muted);font-size:14.5px}
.sw{position:relative;width:54px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;width:100%;height:100%}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.sw input:checked+i{background:var(--hot)}
.sw.good input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(-24px)}
[dir="ltr"] .sw input:checked+i::after{transform:translateX(24px)}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:3px}

/* forms */
label.f{display:block;font-weight:600;margin:14px 0 6px;font-size:15px}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:color-mix(in srgb,var(--bg) 70%,var(--surface));border:1px solid var(--line);border-radius:12px;padding:10px 14px}
textarea{min-height:92px;resize:vertical}
textarea:focus,input[type=text]:focus,select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tag{font-size:12.5px;font-weight:700;color:var(--accent);direction:ltr}
.cnt{font-size:12px;color:var(--muted);direction:ltr}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
select{font:inherit;font-size:15px;color:var(--ink);background:color-mix(in srgb,var(--bg) 70%,var(--surface));border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}

/* date-time picker */
.dt{display:grid;grid-template-columns:1.1fr 1.6fr .9fr .9fr .9fr;gap:8px}
.dt label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 3px;font-weight:500}
.dt select{width:100%}
.dtinfo{margin:10px 0 0;font-size:14.5px;min-height:1.7em}
.dtinfo b{direction:ltr;unicode-bidi:isolate}
.dtinfo.warn{color:var(--warn)}

.pre{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{display:block;text-align:start;font:inherit;border:1.5px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--bg) 70%,var(--surface));color:var(--ink);padding:10px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
.pc:hover{border-color:var(--accent);transform:translateY(-1px)}
.pc b{display:block;font-size:15px}
.pc span{display:block;color:var(--muted);font-size:13.5px;line-height:1.6;margin-top:2px}
.pc[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.pc[aria-pressed="true"] b::before{content:"✓ ";color:var(--accent)}
details.man{margin-top:14px;border:1px dashed var(--line);border-radius:14px;padding:8px 14px}
details.man summary{cursor:pointer;font-weight:600;font-size:15px;padding:4px 0}
details.man[open]{padding-bottom:14px}

.lock{opacity:.45;pointer-events:none;filter:grayscale(.6)}
.perms{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin:10px 0}
label.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:14px;margin:0;line-height:1.5}
label.chk input{margin-top:5px}
.mem{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.mem>b{display:block;direction:ltr;text-align:start;margin-bottom:4px}
.cu{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0;font-size:14.5px}
.cu small{color:var(--muted);display:block;direction:ltr;text-align:start}
.btn.red{background:var(--hot);border-color:var(--hot);color:#fff}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:30px;line-height:1.2}
.stat span{color:var(--muted);font-size:14px}
.stat.hot b{color:var(--hot)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* log */
.log{list-style:none;margin:6px 0 0;padding:0}
.log li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:9px 0;font-size:14.5px}
.log li:first-child{border-top:0}
.log .who2{color:var(--muted);font-size:13px;direction:ltr}
.log bdi{direction:ltr;unicode-bidi:isolate;color:var(--muted);font-size:13px;white-space:nowrap}
.lg{display:inline-block;font-size:12.5px;padding:0 10px;border-radius:99px;border:1.5px solid var(--line);margin-inline-end:8px}
.lg.pause{border-color:var(--hot);color:var(--hot)}
.lg.resume{border-color:var(--ok);color:var(--ok)}

/* bottom bars */
.bar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 3% calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{width:min(1020px,100%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar.deny{border-top:2px solid var(--hot);background:color-mix(in srgb,var(--hot) 10%,var(--surface))}
.bar.deny span{color:var(--ink);font-size:15px}
.bar.deny b{color:var(--hot)}
#msg{font-weight:600;min-height:1.6em;display:flex;align-items:center;gap:8px}
#msg.err{color:var(--hot)}#msg.ok{color:var(--ok)}
#msg.dirty::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--warn)}
.center{min-height:60vh;display:grid;place-items:center}
.box{max-width:480px;text-align:center}

@media (max-width:760px){.perms{grid-template-columns:1fr}.pre{grid-template-columns:1fr}.plate-main{grid-template-columns:1fr}.langs{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.dt{grid-template-columns:1fr 1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg viewBox="135 96 130 204" aria-hidden="true"><path d="M200 135 L255 155 V215 C255 250 230 275 200 292 C170 275 145 250 145 215 V155 Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/><path d="M172 182 L200 240 L228 182" fill="none" stroke="var(--accent)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="166" r="7" fill="var(--hot)"/><path d="M168 128 L178 104 L200 120 L222 104 L232 128 Z" fill="var(--accent)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/></svg>
      <div><span data-i="brand">مركز التحكم</span><small>VYROXX IT SERVICES</small></div>
    </div>
    <div class="tb">
      <div class="seg" id="langSeg" role="group" data-al="lang_aria"><button type="button" data-l="ar">ع</button><button type="button" data-l="en">EN</button><button type="button" data-l="fr">FR</button><button type="button" data-l="es">ES</button></div>
      <button class="theme" id="theme" type="button"></button>
      <div class="who" id="whoBox" hidden><bdi id="email"></bdi><button class="btn alt sm" id="out2" type="button" data-i="so2"></button></div>
    </div>
  </div>

  <div id="loading" class="center"><p class="note" data-i="loading">جارٍ التحميل…</p></div>

  <section id="login" class="center" hidden>
    <div class="box">
      <h1 style="margin:0 0 6px" data-i="brand"></h1>
      <p class="note" data-i="lg_p"></p>
      <button class="btn" id="gbtn" type="button" data-i="lg_b"></button>
      <p id="lerr" class="note" style="color:var(--hot);min-height:1.6em" role="alert"></p>
    </div>
  </section>

  <main id="panel" hidden>
    <section class="plate" id="plate" data-on="1" aria-labelledby="stt">
      <div class="plate-main">
        <div>
          <div class="state"><span class="dot" aria-hidden="true"></span><div class="stt" id="stt" aria-live="polite">…</div></div>
          <div class="meta" id="meta"></div>
        </div>
        <div data-g="sw">
          <button class="hold" id="hold" type="button" disabled><i></i><span id="holdTxt">…</span></button>
          <p class="hint" id="holdHint"></p>
        </div>
      </div>
      <div class="chips" id="chips" data-al="chips_aria"></div>
    </section>

    <section class="card" data-g="sw" aria-labelledby="h-fs">
      <h2 id="h-fs" data-i="fs_h"></h2>
      <p class="sub" data-i="fs_s"></p>
      <div class="row first"><div><b data-i="kp_b"></b><span class="d" data-i="kp_d"></span></div><label class="sw good"><input type="checkbox" id="keep" data-al="kp_b"><i></i></label></div>
    </section>

    <section class="card" data-g="sw" aria-labelledby="h-pz">
      <h2 id="h-pz" data-i="pz_h"></h2>
      <p class="sub" data-i="pz_s"></p>
      <div class="row first"><div><b data-i="pr_b"></b><span class="d" data-i="pr_d"></span></div><label class="sw"><input type="checkbox" id="pr" data-al="pr_b"><i></i></label></div>
      <div class="row"><div><b data-i="pp_b"></b><span class="d" data-i="pp_d"></span></div><label class="sw"><input type="checkbox" id="pp" data-al="pp_b"><i></i></label></div>
      <div class="row"><div><b data-i="pv_b"></b><span class="d" data-i="pv_d"></span></div><label class="sw"><input type="checkbox" id="pv" data-al="pv_b"><i></i></label></div>
    </section>

    <section class="card" data-g="ct" aria-labelledby="h-ms">
      <h2 id="h-ms" data-i="ms_h"></h2>
      <p class="sub" data-i="ms_s"></p>
      <div class="tools" style="margin:0 0 12px">
        <span class="note" data-i="tp_l"></span>
        <select id="tpl" data-al="tp_l"><option value="" data-i="tp_c"></option><option value="maint" data-i="tp_m"></option><option value="tech" data-i="tp_t"></option><option value="away" data-i="tp_a"></option></select>
      </div>
      <div class="langs">
        <div><div class="lh"><span class="tag">العربية</span><span class="cnt" data-c="mAr"></span></div><textarea id="mAr" maxlength="600" dir="rtl"></textarea></div>
        <div><div class="lh"><span class="tag">English</span><span class="cnt" data-c="mEn"></span></div><textarea id="mEn" maxlength="600" dir="ltr"></textarea></div>
        <div><div class="lh"><span class="tag">Français</span><span class="cnt" data-c="mFr"></span></div><textarea id="mFr" maxlength="600" dir="ltr"></textarea></div>
        <div><div class="lh"><span class="tag">Español</span><span class="cnt" data-c="mEs"></span></div><textarea id="mEs" maxlength="600" dir="ltr"></textarea></div>
      </div>

      <label class="f" data-i="un_l"></label>
      <div class="dt" role="group" data-al="un_l">
        <div><label for="uY" data-i="un_y"></label><select id="uY"></select></div>
        <div><label for="uM" data-i="un_m"></label><select id="uM"></select></div>
        <div><label for="uD" data-i="un_d"></label><select id="uD"></select></div>
        <div><label for="uH" data-i="un_h"></label><select id="uH"></select></div>
        <div><label for="uN" data-i="un_n"></label><select id="uN"></select></div>
      </div>
      <div class="tools">
        <button class="btn alt sm" type="button" data-q="1h" data-i="un_q1"></button>
        <button class="btn alt sm" type="button" data-q="3h" data-i="un_q3"></button>
        <button class="btn alt sm" type="button" data-q="tm" data-i="un_qt"></button>
        <button class="btn alt sm" type="button" data-q="x" data-i="un_x"></button>
      </div>

}
function setUntilDate(dt){
  if(!dt||isNaN(dt)){Object.keys(U).forEach(k=>U[k].value="");buildDays("");dtInfo();return}
  const ys=Array.from(U.Y.options).map(o=>o.value);
  if(!ys.includes(String(dt.getFullYear()))){const o=document.createElement("option");o.value=o.textContent=String(dt.getFullYear());U.Y.append(o)}
  U.Y.value=String(dt.getFullYear());U.M.value=String(dt.getMonth()+1);buildDays(String(dt.getDate()));
  U.D.value=String(dt.getDate());U.H.value=String(dt.getHours());U.N.value=String(dt.getMinutes());dtInfo();
}
function setUntilISO(s){const ok=/^\d{4}-\d{2}-\d{2}T/.test(s||"");setUntilDate(ok?new Date(s):null)}
function dtInfo(){

  if(!iso){el.textContent=t("un_none");return}

  el.textContent=t("un_show");
  const b=document.createElement("b");b.textContent=d.toLocaleString(LOC[L],{dateStyle:"full",timeStyle:"short"});
  el.append(b,t("un_tz"));
}
function defaultDate(){const d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);return d}
Object.keys(U).forEach(k=>U[k].addEventListener("change",()=>{
  const blank=Object.keys(U).filter(x=>x!==k&&U[x].value==="").length;
  if(blank===4&&U[k].value!==""){            /* first pick: fill the rest with sensible defaults */
    const keepVal=U[k].value,d=defaultDate();
    if(k!=="Y")U.Y.value=String(d.getFullYear());
    if(k!=="M")U.M.value=String(d.getMonth()+1);
    buildDays(k==="D"?keepVal:String(d.getDate()));
    if(k!=="D")U.D.value=String(d.getDate());
    if(k!=="H")U.H.value=String(d.getHours());
    if(k!=="N")U.N.value=String(d.getMinutes());
  }else if(k==="Y"||k==="M"){buildDays()}

/* ============ writes (full doc + audit entry, one atomic batch) ============ */
async function commit(action,enabled){
  if(busy||!user)return;
  busy=true;$("hold").disabled=true;$("save").disabled=true;say("m_work");
  try{
    const f=formState(),b0=baseState(),ch={};
    Object.keys(f).forEach(k=>{if(f[k]!==b0[k])ch[k]=f[k]});
    if(action==="pause"){ch.pauseAt="";ch.resumeAt=f.resumeAt}
    if(action==="resume"){ch.pauseAt="";ch.resumeAt=""}
    if(action!=="resume"&&f.pauseAt&&f.resumeAt&&f.resumeAt<=f.pauseAt){busy=false;say("sc_bad","err");render();return}
    ["pauseAt","resumeAt"].forEach(k=>{if(k in ch)ch[k]=ch[k]?Timestamp.fromDate(new Date(ch[k])):null});
    const data=Object.assign({enabled},ch,{updatedAt:serverTimestamp(),updatedBy:user.email});
    const b=writeBatch(db);
    b.set(REF(),data,{merge:true});
    b.set(doc(collection(db,"siteLog")),{action,by:user.email,at:serverTimestamp()});
    await b.commit();
    dirty=false;say(action==="pause"?"m_paused":action==="resume"?"m_resumed":"m_saved","ok");
  }catch(e){say(null,"err",t("m_fail")+(e.code||e.message)+t("m_rules"))}
  busy=false;render();
}

/* ============ hold to confirm ============ */
(function(){
  const h=$("hold");let tm=null,down=false;
  function begin(){if(down||h.disabled)return;down=true;h.classList.add("go");tm=setTimeout(()=>finish(true),1100)}
  function finish(ok){clearTimeout(tm);if(!down)return;down=false;h.classList.remove("go");if(ok){const on=effOn(cur);commit(on?"pause":"resume",!on)}}
  h.addEventListener("pointerdown",e=>{e.preventDefault();begin()});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>h.addEventListener(ev,()=>finish(false)));
  h.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat){e.preventDefault();begin()}});
  h.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")finish(false)});
  h.addEventListener("blur",()=>finish(false));
  h.addEventListener("contextmenu",e=>e.preventDefault());
})();

/* ============ schedule (start / auto-resume) ============ */
const isoOf=x=>x&&x.toDate?x.toDate().toISOString():"";
const effOn=x=>{const n=Date.now(),m=v=>v&&v.toDate?v.toDate().getTime():null,pa=m(x.pauseAt),ra=m(x.resumeAt),af=ra!=null&&n>=ra;return x.enabled===false?af:!(pa!=null&&n>=pa&&!af)};
function mkDT(box,chg){
  const S=[0,1,2,3,4].map(()=>{const s=document.createElement("select");box.append(s);return s}),[Y,M,D,H,N]=S;
  const o=(s,l,k)=>{const v=k!==undefined?k:s.value;s.textContent="";l.forEach(a=>{const e=document.createElement("option");e.value=a[0];e.textContent=a[1];s.append(e)});s.value=v;if(s.value!==v)s.value=""};

  function build(){
    const k=S.map(s=>s.value),y0=new Date().getFullYear(),ys=[y0,y0+1,y0+2];if(k[0]&&!ys.includes(+k[0]))ys.push(+k[0]);
    o(Y,[["",t("un_y")]].concat(ys.sort().map(v=>[""+v,""+v])),k[0]);
    const mf=new Intl.DateTimeFormat(LOC[L],{month:"long"});
    o(M,[["",t("un_m")]].concat(rng(12,i=>[""+(i+1),mf.format(new Date(2024,i,1))])),k[1]);
    days(k[2]);
    o(H,[["",t("un_h")]].concat(rng(24,i=>[""+i,p2(i)])),k[3]);
    o(N,[["",t("un_n")]].concat(rng(60,i=>[""+i,p2(i)])),k[4]);
  }
  function get(){if(S.some(s=>s.value===""))return "";const m=+M.value,d=new Date(+Y.value,m-1,+D.value,+H.value,+N.value);return d.getMonth()===m-1?d.toISOString():""}
  function set(v){
    const d=v?new Date(v):null;
    if(!d||isNaN(d)){S.forEach(s=>s.value="");days("");return}
    if(!Array.from(Y.options).some(e=>e.value===""+d.getFullYear())){const e=document.createElement("option");e.value=e.textContent=""+d.getFullYear();Y.append(e)}
    Y.value=""+d.getFullYear();M.value=""+(d.getMonth()+1);days(""+d.getDate());H.value=""+d.getHours();N.value=""+d.getMinutes();

}
