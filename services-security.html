var PTI=['<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>','<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>','<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>'];
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function $(i){return document.getElementById(i)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function tx(k){var o=(D.TX||{})[k];return o?(o[lang]||o.en||""):""}
function items(){
  var l=lang,out=[];
  (D.SV[l]||[]).forEach(function(s,i){
    var sec=D.SEC.indexOf(i)>-1,dev=D.DEV.indexOf(i)>-1;
    if((CAT==="security"&&sec)||(CAT==="web"&&dev)||(CAT==="support"&&!sec&&!dev))out.push({k:i,ic:D.IC[i],t:s[0],b:s[1],pr:D.PR[i]});
  });
  return out;
}
function drawHero(){
  var c=C[CAT],l=lang,h=$("heroSx");h.textContent="";
  h.style.setProperty("--c",c.c);h.style.setProperty("--on",ON[CAT]);
  var wm=el("div","sx-wm",c.ic);wm.setAttribute("aria-hidden","true");h.appendChild(wm);
  var g=el("div","sx-grid"),m=el("div","sx-main");
  m.appendChild(el("span","tp-eyebrow",c.eb[l]));m.appendChild(el("h1","sx-t",c.t[l]));m.appendChild(el("p","sx-p",c.p[l]));
  var ul=el("ul","sx-pts");
  (c.pts[l]||c.pts.en).forEach(function(p,i){var li=el("li"),ic=el("span","sx-ic"),d=el("div");ic.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+PTI[i%3]+'</svg>';d.appendChild(el("b",null,p[0]));d.appendChild(el("span",null,p[1]));li.appendChild(ic);li.appendChild(d);ul.appendChild(li)});
  m.appendChild(ul);
  var act=el("div","sx-act"),a=el("a","btn sx-go",L[l].cb);a.href="/#request";act.appendChild(a);
  var b=el("a","btn alt",L[l].back);b.href="/#services";act.appendChild(b);
  var sn=el("a","btn alt","🛰️ "+C.lbl.sentinel[l]);sn.href="sentinel.html";act.appendChild(sn);m.appendChild(act);
  var n=CAT==="business"?(D.BZ[l]||[]).length:items().length;
  var v=el("div","sx-vis"),hd=el("div","sx-head");hd.appendChild(el("div","sx-orb",c.ic));
  var cn=el("div","sx-cnt",String(n));cn.appendChild(el("small",null,C.lbl.services[l]));hd.appendChild(cn);v.appendChild(hd);
  g.appendChild(m);g.appendChild(v);h.appendChild(g);
}
function drawBody(){
  var l=lang,b=$("body"),c=C[CAT];b.textContent="";
  var grid=el("div","sv-grid");grid.style.setProperty("--c",c.c);
  if(CAT==="business"){
    (D.BZ[l]||[]).forEach(function(z){
      var d=el("article","sv");d.style.setProperty("--c",c.c);d.style.setProperty("--on",ON[CAT]);
      d.appendChild(el("div","sv-bt",z[1]));
      var top=el("div","sv-top");top.appendChild(el("span","sv-i",z[0]));top.appendChild(el("h3",null,z[2]));d.appendChild(top);
      var ul=el("ul");z[3].forEach(function(i){var li=el("li"),bb=el("b",null,i[0]+" ");li.appendChild(bb);li.appendChild(document.createTextNode(i[1]));ul.appendChild(li)});
      d.appendChild(ul);grid.appendChild(d);
    });
    b.appendChild(grid);
    var sla=el("div","box2"),se=el("span","e","⏱️"),sd=el("div");sd.appendChild(el("b",null,tx("sla_t")));sd.appendChild(el("small",null,tx("sla_d")));sla.appendChild(se);sla.appendChild(sd);b.appendChild(sla);
    var co=el("div","box2"),ce=el("span","e","🤝"),cd=el("div");cd.appendChild(el("b",null,tx("b_ct")));cd.appendChild(el("p",null,tx("b_consent")));co.appendChild(ce);co.appendChild(cd);b.appendChild(co);
    b.appendChild(el("h2","hd",tx("bs_h")));
    var st=el("div","sv-grid");
    [1,2,3,4].forEach(function(n){var s=el("article","sv");s.style.setProperty("--c",c.c);var t=el("div","sv-top");t.appendChild(el("span","sv-i",String(n)));t.appendChild(el("h3",null,tx("bs"+n+"t")));s.appendChild(t);s.appendChild(el("p",null,tx("bs"+n+"d")));s.lastChild.style.cssText="margin:0;color:var(--muted)";st.appendChild(s)});
    b.appendChild(st);
    var cta=el("p",null,tx("b_note"));cta.style.cssText="color:var(--muted);margin:18px 0 0";b.appendChild(cta);
    return;
  }
  items().forEach(function(s){
    var d=el("article","sv");d.style.setProperty("--c",c.c);d.style.setProperty("--on",ON[CAT]);
    var top=el("div","sv-top");top.appendChild(el("span","sv-i",s.ic));top.appendChild(el("h3",null,s.t));d.appendChild(top);
    var ul=el("ul");s.b.forEach(function(x){ul.appendChild(el("li",null,x))});d.appendChild(ul);
    var f=el("div","sv-f"),pr=el("div","sv-pr","$"+s.pr);pr.appendChild(el("small",null,L[l].from+" ≈ "+Math.ceil(s.pr*D.RATE/10)*10+" DH"));f.appendChild(pr);
    var a=el("a","sv-go",L[l].req);a.href="/?s="+s.k+"#request";f.appendChild(a);d.appendChild(f);grid.appendChild(d);
  });
  b.appendChild(grid);
  if(CAT==="web"||CAT==="security"){var n=el("p",null,tx(CAT==="web"?"g3n":"note"));n.style.cssText="color:var(--muted);margin:18px 0 0";b.appendChild(n)}
}
function drawOthers(){
  var l=lang,o=$("others");o.textContent="";$("othH").textContent=L[l].oth;
  C.order.forEach(function(k){
    if(k===CAT)return;var c=C[k],a=el("a","oth");a.href=c.page;a.style.setProperty("--c",c.c);
    a.appendChild(el("i",null,c.ic));var d=el("div");d.appendChild(el("b",null,c.t[l]));d.appendChild(el("span",null,c.btn[l]));a.appendChild(d);o.appendChild(a);
  });
}
function setLang(l,save){
  if(!L[l])l="en";lang=l;var t=L[l],c=C[CAT],d=document.documentElement;
  d.lang=l;d.dir=l==="ar"?"rtl":"ltr";document.title=c.t[l]+" | VYROXX IT";
  var md=document.querySelector('meta[name="description"]');if(md)md.content=c.p[l];
  $("home").textContent=t.home;$("ch").textContent=t.ch;$("cp").textContent=t.cp;$("cb").textContent=t.cb;$("ft").textContent=t.ft;$("theme").setAttribute("aria-label",t.th);
  [].forEach.call(document.querySelectorAll("#seg button"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-l")===l))});
  drawHero();drawBody();drawOthers();
  if(save)put("vx-lang",l);
}
[].forEach.call(document.querySelectorAll("#seg button"),function(b){b.onclick=function(){setLang(b.getAttribute("data-l"),true)}});
function curTheme(){var a=document.documentElement.getAttribute("data-theme");if(THEMES.indexOf(a)>-1)return a;return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function setTheme(m){document.documentElement.setAttribute("data-theme",m);$("theme").textContent=ICON[m];put("vx-theme",m)}
$("theme").onclick=function(){setTheme(THEMES[(THEMES.indexOf(curTheme())+1)%4])};
$("theme").textContent=ICON[curTheme()];
var sl=get("vx-lang");setLang(L[sl]?sl:"en",false);
})();
</script>
</body>
