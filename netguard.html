<main class="w">
  <section class="hero2">
    <span class="tp-eyebrow" data-t="NETWORK RADAR"></span>
    <h1><span data-t="Who is"></span> <em data-t="on your network?"></em></h1>
    <p class="lead" data-t="A lightweight scanner that runs on your device, lists every device on your home or office network and its exposed ports, plus an analysis dashboard that reveals the intruder."></p>
    <div class="note2"><b data-t="Why doesn’t the page scan your network directly?"></b><br><span data-t="Browsers block web pages from scanning the local network to protect you. So we use a small scanner (netguard.py) that you run on your device, then load its result here for analysis."></span></div>
  </section>

  <section class="cd" id="s1">
    <h2><b data-t="Step 1:"></b> <span data-t="run the scanner"></span></h2>
    <p data-t="Scan only your own network or one you are authorized to test."></p>
    <div class="tabs" id="ost"><button class="tab" type="button" data-os="0">Windows</button><button class="tab" type="button" data-os="1">macOS / Linux</button><button class="tab" type="button" data-os="2">Android (Termux)</button></div>
    <pre class="o" id="cmd"></pre>
    <div class="row" style="margin-top:12px"><button class="btn alt sm" id="cc" type="button" data-t="Copy"></button><a class="btn p" href="netguard.py" download data-t="Download netguard.py"></a></div>
    <p style="color:var(--muted);margin:14px 0 4px" data-t="The scanner only scans private networks (192.168.x.x, 10.x.x.x, 172.16–31.x.x) and asks for your confirmation before it starts."></p>
    <p style="color:var(--muted);margin:0 0 4px" id="termux" data-t="On Android use the Termux app. MAC addresses may not appear without extra permissions."></p>
    <p style="color:var(--muted);margin:0" data-t="When the scan ends, netguard-report.json is created. Upload it in the next step."></p>
    <details class="tsb" id="trb"><summary data-t="Report file not created? Check this"></summary><ol class="tl"><li data-t="When asked “Continue?”, type y and press Enter. Any other answer cancels the scan and no file is created."></li><li data-t="Wait until you see “REPORT SAVED TO”. The scan takes 30–90 seconds and the file is created only at the very end."></li><li data-t="The full path of the file is printed at the end and its folder opens automatically. With the commands above it is saved in your Downloads folder."></li><li data-t="If you see “python is not recognized”, install Python from python.org, tick “Add Python to PATH”, then open a new terminal window."></li><li data-t="Still nothing? Run it again and read the messages in the terminal: they explain why (for example a refused network or no permission)."></li></ol></details>
  </section>

  <section class="cd" id="s2">
    <h2><b data-t="Step 2:"></b> <span data-t="load the report"></span></h2>
    <p data-t="Choose the report file or paste its content."></p>
    <div class="row"><label class="btn p" for="fi" data-t="Choose report file (JSON)"></label><input id="fi" type="file" accept=".json,application/json" hidden><button class="btn alt" id="dm" type="button" data-t="Show a demo example"></button></div>
    <textarea class="in mono" id="tx" style="margin:14px 0" data-ph="Paste the report content here" spellcheck="false"></textarea>
    <div class="row"><button class="btn" id="an" type="button" data-t="Analyze"></button><span style="color:var(--muted);font-size:14px" data-t="Or drop the report file anywhere on this card"></span></div>
  </section>

  <section id="res" class="hid">
    <h2 class="hd2"><b data-t="Scan"></b> <span data-t="result"></span></h2>
    <div class="score" id="sc"></div>
    <div class="st" id="st"></div>
    <p style="color:var(--muted);margin:0 0 6px" data-t="Tap “This is my device” on your own devices; whatever remains unknown deserves attention."></p>
    <div id="al"></div><div id="ch"></div>

    <h2 class="hd2"><b data-t="Vulnerabilities"></b> <span data-t="and recommendations"></span></h2>
    <div class="vl" id="vl"></div>
  </section>

  <section class="cd" id="stp"><h2 class="hd2" style="margin-top:0"><b data-t="What to do if you find"></b> <span data-t="an intruder?"></span></h2><ol id="stl" style="margin:10px 0 0;padding-inline-start:24px;line-height:2"></ol></section>
  <section class="cd"><h2 class="hd2" style="margin-top:0"><b data-t="Router"></b> <span data-t="hardening checklist"></span></h2><p data-t="Tick what you’ve actually done to see your network’s protection level."></p><div class="cl" id="cl"></div><div class="score" id="cs"></div></section>

  var rk=H.filter(function(h){return (h.ports||[]).some(function(p){return p.risk==="high"||p.risk==="medium"})});
  var hi=0,md=0;H.forEach(function(h){(h.ports||[]).forEach(function(p){if(p.risk==="high")hi++;else if(p.risk==="medium")md++})});
  var pts=un.length*12+hi*20+md*8,m={H:H,un:un,rk:rk,hi:hi,md:md,pts:pts,health:Math.max(0,100-pts),lvl:pts>=50?"high":pts>=20?"medium":"low",added:[],gone:[],first:!prev};
  if(prev){
    var pk={},ck={};prev.list.forEach(function(x){pk[x.k]=1});H.forEach(function(h){ck[key(h)]=1});
    m.added=H.filter(function(h){return !pk[key(h)]});m.gone=prev.list.filter(function(x){return !ck[x.k]});
  }
  return m;
}
function addedHas(h){return M.added.some(function(x){return key(x)===key(h)})}

/* ---------- rendering ---------- */
function tile(n,l,hot){return '<div><b'+(hot?' style="color:var(--hot)"':"")+">"+n+"</b><small>"+esc(T(l))+"</small></div>"}
function render(){
  if(!R||!M)return;
  $("res").classList.remove("hid");
  var col=M.health>=80?"#1E9E6A":M.health>=50?"#E8A317":"var(--hot)";
  $("sc").innerHTML='<div class="ring" style="--p:'+M.health+";--vc:"+col+'"><b>'+M.health+'</b></div><div style="flex:1;min-width:220px"><div style="font-weight:800;font-size:22px;color:'+col+'">'+esc(T("Network health"))+" · "+esc(T("Risk level"))+": "+esc(T(RL[M.lvl]))+'</div><div class="mono" style="color:var(--muted);margin-top:6px">'+esc(T("Network"))+": "+esc(R.subnet||"")+" · "+esc(T("Scan time"))+": "+esc(R.time||"")+"</div>"+(R.ports_checked===false?'<div style="color:var(--muted);margin-top:4px">'+esc(T("Ports were not checked in this report."))+"</div>":"")+"</div>";
  $("st").innerHTML=tile(M.H.length,"Connected devices")+tile(M.H.length-M.un.length,"Trusted")+tile(M.un.length,"Unknown",M.un.length>0)+tile(M.rk.length,"Devices with risky ports",M.rk.length>0)+tile(esc(T(RL[M.lvl])),"Risk level");
  $("al").innerHTML=M.un.length?'<div class="al bad"><b>🚨 '+esc(T("Alert: unknown devices"))+" ("+M.un.length+")</b>"+esc(T("You haven’t confirmed these devices are yours. If you don’t recognize them, they may be intruders."))+"</div>":'<div class="al good"><b>✅ '+esc(T("All devices are trusted"))+"</b></div>";
  var c="";
  if(R.time==="DEMO")c='<div class="fd">'+esc(T("Demo data is never saved."))+"</div>";
  else if(M.first)c='<div class="fd">'+esc(T("First scan of this network saved. Next time, changes will appear here."))+"</div>";
  else if(!M.added.length&&!M.gone.length)c='<div class="fd ok">'+esc(T("No changes since the last scan ✓"))+"</div>";
  else c=M.added.map(function(h){return '<div class="fd hi">🆕 '+esc(T("New device"))+": <b class=\"mono\">"+esc(h.ip)+"</b> "+esc(h.vendor||h.hostname||h.mac||"")+"</div>"}).join("")+M.gone.map(function(x){return '<div class="fd wn">⏏ '+esc(T("No longer connected"))+": <b class=\"mono\">"+esc(x.ip||x.k)+"</b> "+esc(x.n||"")+"</div>"}).join("");
  $("ch").innerHTML='<h3 style="margin:16px 0 4px">'+esc(T("Changes since the last scan"))+"</h3>"+c;
  toolbar();devs();vulns();
}
function toolbar(){
  var tb=$("tb");tb.textContent="";
  [["all","All",M.H.length],["un","Unknown",M.un.length],["risk","Risky",M.rk.length]].forEach(function(f){
    var b=document.createElement("button");b.type="button";b.className="fc";b.textContent=T(f[1])+" · "+f[2];b.setAttribute("aria-pressed",String(filter===f[0]));
    b.onclick=function(){filter=f[0];toolbar();devs()};tb.appendChild(b);
  });
  var i=document.createElement("input");i.className="in";i.type="search";i.placeholder=T("Search devices…");i.value=q;i.oninput=function(){q=i.value;devs()};tb.appendChild(i);
  var sp=document.createElement("span");sp.className="sp";tb.appendChild(sp);
  var ex=document.createElement("button");ex.type="button";ex.className="btn alt sm";ex.textContent=T("Export report");ex.onclick=exportJson;tb.appendChild(ex);
  var pr=document.createElement("button");pr.type="button";pr.className="btn alt sm";pr.textContent=T("Print");pr.onclick=function(){window.print()};tb.appendChild(pr);
}
function devs(){
  var box=$("dev"),ql=q.trim().toLowerCase();box.textContent="";
  M.H.filter(function(h){
    var un=M.un.indexOf(h)>-1;
    if(filter==="un"&&!un)return false;if(filter==="risk"&&M.rk.indexOf(h)<0)return false;
    return !ql||[h.ip,h.mac,h.vendor,h.hostname].join(" ").toLowerCase().indexOf(ql)>-1;
  }).forEach(function(h){
    var un=M.un.indexOf(h)>-1,tt=dtype(h),d=document.createElement("div");d.className="dc "+(un?"un":"tr");
    var tags=[];
    if(h.gateway)tags.push(["b",T("Router")]);if(h.self)tags.push(["b",T("This device")]);
    tags.push(un?["r",T("Unknown")]:["g",T("Trusted")]);if(addedHas(h)&&R.time!=="DEMO")tags.push(["y",T("New device")]);
    d.innerHTML='<div class="h"><span class="ic">'+tt[1]+'</span><div><div class="ip">'+esc(h.ip)+'</div><div class="sm">'+esc(T(tt[0]))+(h.vendor||h.hostname?" · "+esc(h.vendor||h.hostname):"")+"</div></div></div>"
     +'<div>'+tags.map(function(t){return '<span class="bd '+t[0]+'" style="margin-inline-end:6px">'+esc(t[1])+"</span>"}).join("")+"</div>"
     +'<div class="m">'+esc(h.mac||"—")+"</div>"+(h.private_mac?'<div class="sm">'+esc(T("Private MAC address (usually a modern phone)"))+"</div>":"")
     +'<div class="pt">'+((h.ports||[]).length?h.ports.map(function(p){return '<span class="'+p.risk+'" style="border-color:currentColor">'+p.port+" "+esc(p.service)+"</span>"}).join(""):'<span class="info">'+esc(T("No open ports"))+"</span>")+"</div>";
    if(!h.gateway&&!h.self){
      var b=document.createElement("button");b.type="button";b.className="btn sm "+(un?"p":"alt");b.textContent=un?T("This is my device"):T("Remove trust");
      b.onclick=function(){var k=key(h);if(TR[k])delete TR[k];else TR[k]=1;sv("vx_trust",TR);M=analyze(R,TR,PREV);render()};d.appendChild(b);
    }
    box.appendChild(d);
  });
}
function vulns(){
  var o="";
  M.H.forEach(function(h){(h.ports||[]).forEach(function(p){
    if(p.risk==="info"&&!REC[p.port])return;
    o+='<div class="fd '+(p.risk==="high"?"hi":p.risk==="medium"?"wn":"")+'"><b class="mono">'+esc(h.ip)+":"+p.port+" "+esc(p.service)+'</b> <span class="bd" style="color:'+(COL[p.risk]||"var(--muted)")+'">'+esc(T(RL[p.risk]))+"</span><br>"+esc(REC[p.port]?T(REC[p.port]):"")+"</div>";
  })});
  $("vl").innerHTML=o||'<div class="fd ok">'+esc(T("No risky open ports found ✓"))+"</div>";
}
function exportJson(){
  var out={tool:"VYROXX NETGUARD dashboard",generated:new Date().toISOString(),subnet:R.subnet,scan_time:R.time,health:M.health,level:M.lvl,unknown:M.un.map(function(h){return h.ip}),risky:M.rk.map(function(h){return h.ip}),new_since_last:M.added.map(function(h){return h.ip}),hosts:M.H};
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));a.download="netguard-analysis.json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600);
}

/* ---------- loading a report ---------- */
function load(txt){
  var j;try{j=JSON.parse(txt);if(!j||!Array.isArray(j.hosts))throw 0;j.hosts.forEach(function(h){if(typeof h.ip!=="string")throw 0;h.ports=Array.isArray(h.ports)?h.ports:[]})}catch(e){VXA.toast(T("Invalid file"));return}
  R=j;var demo=R.time==="DEMO",pk="vx-ng-prev:"+(R.subnet||"");
  PREV=demo?null:ld(pk);M=analyze(R,TR,PREV);
  if(demo)M.first=false;
  else sv(pk,{t:R.time,list:R.hosts.map(function(h){return {k:key(h),ip:h.ip,n:h.vendor||h.hostname||""}})});
  filter="all";q="";render();$("res").scrollIntoView({behavior:"smooth"});
}
$("fi").onchange=async function(e){var f=e.target.files[0];if(f)load(await f.text());this.value=""};
$("an").onclick=function(){var v=$("tx").value.trim();v?load(v):VXA.toast(T("Paste the report first"))};
$("dm").onclick=function(){load(JSON.stringify(DEMO))};
var s2=$("s2");["dragover","dragenter"].forEach(function(ev){s2.addEventListener(ev,function(e){e.preventDefault();s2.classList.add("dropping")})});
["dragleave","drop"].forEach(function(ev){s2.addEventListener(ev,function(e){e.preventDefault();s2.classList.remove("dropping")})});
s2.addEventListener("drop",async function(e){var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)load(await f.text())});

/* ---------- step 1 ---------- */
function stp(){
  [].forEach.call(document.querySelectorAll("#ost .tab"),function(b){b.setAttribute("aria-pressed",String(+b.getAttribute("data-os")===osi))});
  $("cmd").textContent=CMD[osi];$("termux").classList.toggle("hid",osi!==2);
}
$("ost").onclick=function(e){var b=e.target.closest(".tab");if(b){osi=+b.getAttribute("data-os");stp()}};
$("cc").onclick=function(){VXA.copy(CMD[osi].split("\n\n")[0])};

/* ---------- intruder steps + router checklist ---------- */
function lists(){
  $("stl").innerHTML=STEPS.map(function(s){return "<li>"+esc(T(s))+"</li>"}).join("");
  $("cl").innerHTML=CHK.map(function(c,i){return '<div class="qi'+(ck[i]?" on":"")+'" data-q="'+i+'" role="checkbox" aria-checked="'+!!ck[i]+'" tabindex="0"><span>'+(ck[i]?"✅":"⬜")+"</span><span>"+esc(T(c))+"</span></div>"}).join("");
  var n=ck.filter(Boolean).length,p=Math.round(n/CHK.length*100),lv=p>=85?[0,"#1E9E6A"]:p>=60?[1,"#9be22e"]:p>=35?[2,"#E8A317"]:[3,"#ff4d5e"];
  $("cs").innerHTML='<div class="ring" style="--p:'+p+";--vc:"+lv[1]+'"><b>'+p+'%</b></div><div style="font-weight:800;font-size:22px;color:'+lv[1]+'">'+esc(T(LV[lv[0]]))+"</div>";
}
$("cl").onclick=function(e){var q=e.target.closest("[data-q]");if(q){ck[+q.getAttribute("data-q")]^=1;lists()}};
$("cl").onkeydown=function(e){if(e.key===" "||e.key==="Enter"){var q=e.target.closest("[data-q]");if(q){e.preventDefault();var i=+q.getAttribute("data-q");ck[i]^=1;lists();document.querySelectorAll("#cl [data-q]")[i].focus()}}};

VXA.onLang(function(){stp();lists();if(R&&M)render()});
VXA.start();
})();
</script>
</body>
