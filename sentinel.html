<style>

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8;font-size:17px;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);background-image:radial-gradient(900px 480px at 85% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 62%);background-repeat:no-repeat}
a{color:inherit}

@media (max-width:820px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

var LOC={ar:"ar-MA",en:"en-GB",fr:"fr-FR",es:"es-ES"},THEMES=["light","dark","legend","hacker"],ICON={light:"🌙",dark:"🔮",legend:"👾",hacker:"☀️"};
var KEY="vx-sentinel-v1",MAXROWS=500;
var lang="en",mode="base",tab="mon",pending=null,busy=false,stopFlag=false,lastRes=null,lastBase=null,filter="all",q="",ckHashes=null;
function $(i){return document.getElementById(i)}
function t(k){return (U[lang]&&U[lang][k])||U.en[k]||k}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function loadAll(){try{return JSON.parse(get(KEY)||"{}")||{}}catch(e){return {}}}
function saveAll(o){try{localStorage.setItem(KEY,JSON.stringify(o));return true}catch(e){return false}}
function say(m){$("rd").textContent=m||""}
function dl(name,mime,text){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600)}
function fdate(ms){return ms?new Date(ms).toLocaleString(LOC[lang]):"—"}

/* ---------- terminal ---------- */
var buf=[],dirty=false;
function stamp(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2)}
function flush(){dirty=false;$("term").textContent=buf.join("\n")}
function log(line){buf.push("["+stamp()+"] "+line);if(buf.length>9)buf.shift();if(!dirty){dirty=true;requestAnimationFrame(flush)}}

/* ---------- collecting files ---------- */
function fromInput(list){return VXS.stripRoot([].map.call(list,function(f){return {p:f.webkitRelativePath||f.name,f:f}}))}
async function walk(entry,path,out){
  if(entry.isFile){var f=await new Promise(function(r){entry.file(r,function(){r(null)})});if(f)out.push({p:path+entry.name,f:f})}
  else if(entry.isDirectory){
    var rd=entry.createReader(),all=[];
    for(;;){var b=await new Promise(function(r){rd.readEntries(r,function(){r([])})});if(!b.length)break;all=all.concat([].slice.call(b))}
    for(var i=0;i<all.length;i++)await walk(all[i],path+entry.name+"/",out);
  }
}
async function fromDrop(dt){
  var out=[],items=dt.items,ents=[];
  if(items&&items.length&&items[0].webkitGetAsEntry){
    for(var i=0;i<items.length;i++){var e=items[i].webkitGetAsEntry();if(e)ents.push(e)}
    for(var j=0;j<ents.length;j++)await walk(ents[j],"",out);
  }else for(var k=0;k<dt.files.length;k++)out.push({p:dt.files[k].name,f:dt.files[k]});
  return VXS.stripRoot(out);
}
function setPending(items){
  pending=items&&items.length?items:null;
  var n=pending?pending.length:0,s=0;if(pending)pending.forEach(function(i){s+=i.f.size});
  say(n?(n+" "+t("ready")+" · "+VXS.fmtSize(s)):"");
  $("go2").disabled=!n||busy;
}

/* ---------- modes / tabs ---------- */
function setMode(m){
  mode=m;
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-mode")===m))});
  $("boxBase").classList.toggle("hid",m!=="base");$("boxVerify").classList.toggle("hid",m!=="verify");
  $("res").classList.add("hid");$("basedone").classList.add("hid");
}
function setTab(x){
  tab=x;
  [].forEach.call(document.querySelectorAll(".tab"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-tab")===x))});
  $("paneMon").classList.toggle("hid",x!=="mon");$("paneChk").classList.toggle("hid",x!=="chk");
}
function renderBases(){
  var s=$("bs"),all=loadAll(),names=Object.keys(all),cur=s.value;s.textContent="";
  if(!names.length){var o=el("option",null,t("nob"));o.value="";s.appendChild(o)}
  names.forEach(function(n){var b=all[n],o=el("option",null,n+" · "+(b.count||0)+" "+t("files")+" · "+new Date(b.created||0).toLocaleDateString(LOC[lang]));o.value=n;s.appendChild(o)});
  if(names.indexOf(cur)>-1)s.value=cur;
}

/* ---------- scanning ---------- */
function prog(n,total,p,rec,size){
  $("pb").style.width=(n/total*100).toFixed(1)+"%";$("pn").textContent=n+" / "+total;$("pz").textContent=VXS.fmtSize(size);
  log((rec[3]===1?"SKIP  ":rec[3]===2?"ERROR ":"SHA256 ")+(rec[0]?rec[0].slice(0,14)+"… ":"")+p);
}
async function start(){
  if(busy||!pending)return;
  if(!(window.crypto&&crypto.subtle)){say(t("e_api"));return}
  var name,base=null;
  if(mode==="base"){name=$("bn").value.trim();if(!name){say(t("e_name"));$("bn").focus();return}}
  else{
    name=$("bs").value;var all=loadAll();
    if(!name||!all[name]){say(t("e_pick"));return}
    try{base=VXS.unpack(all[name])}catch(e){say(t("e_bad"));return}
  }
  busy=true;stopFlag=false;$("go2").disabled=true;$("stop").classList.remove("hid");
  $("res").classList.add("hid");$("basedone").classList.add("hid");buf=[];log("VYROXX SENTINEL · "+(mode==="base"?"BASELINE":"VERIFY")+" · "+pending.length+" files");
  try{
    var map=await VXS.scan(pending,{cancel:function(){return stopFlag},onProgress:prog});
    if(mode==="base")finishBase(name,map);else finishVerify(base,map);
  }catch(e){log(t("cancelled"));say(t("cancelled"))}
  busy=false;$("stop").classList.add("hid");$("go2").disabled=!pending;flush();
}
function finishBase(name,map){
  var all=loadAll(),pk=VXS.pack(name,map);all[name]=pk;
  if(!saveAll(all))say(t("e_save"));
  lastBase=pk;renderBases();$("bs").value=name;
  $("bsum").textContent=map.size+" "+t("sum")+" · "+VXS.fmtSize(pk.size);
  $("basedone").classList.remove("hid");log("BASELINE SAVED · "+name);
  $("basedone").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function finishVerify(base,map){
  lastRes=VXS.compare(base.map,map);lastRes.base=base.name;lastRes.when=Date.now();
  log("DONE · "+lastRes.verdict.toUpperCase()+" · score "+lastRes.score);
  filter="all";q="";renderResult();
  $("res").scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ---------- results ---------- */
function renderResult(){
  var r=lastRes;if(!r)return;
  $("res").classList.remove("hid");
  var vk={clean:"v_clean",alert:"v_alert",critical:"v_crit"}[r.verdict];
  $("vd").className="vd "+r.verdict;$("ring").style.setProperty("--p",r.score);$("sco").textContent=r.score;
  $("vt").textContent=t(vk);$("vp").textContent=t(vk+"_d");
  var st=r.st,sg=$("stats");sg.textContent="";
  [["st_mod",st.mod],["st_add",st.add],["st_del",st.del],["st_ok",st.ok],["st_risk",st.risk+st.stealth*0]].forEach(function(x){
    var c=el("div","sc"+(x[0]==="st_risk"&&x[1]?" hot":"")),b=el("b",null,String(x[1]));c.appendChild(b);c.appendChild(el("span",null,t(x[0])));sg.appendChild(c);
  });
  var tb=$("tbar");tb.textContent="";
  [["all","f_all",r.rows.length],["mod","st_mod",st.mod],["add","st_add",st.add],["del","st_del",st.del],["risk","st_risk",st.risk]].forEach(function(f){
    var b=el("button","fc",t(f[1])+" · "+f[2]);b.type="button";b.setAttribute("aria-pressed",String(filter===f[0]));
    b.onclick=function(){filter=f[0];renderResult()};tb.appendChild(b);
  });
  var si=el("input","in");si.type="search";si.placeholder=t("search");si.value=q;si.setAttribute("aria-label",t("search"));
  si.oninput=function(){q=si.value;drawRows()};tb.appendChild(si);tb.appendChild(el("span","sp"));
  [["ex_json",function(){dl("sentinel-report.json","application/json",JSON.stringify({tool:"VYROXX Sentinel",baseline:r.base,generated:new Date(r.when).toISOString(),verdict:r.verdict,score:r.score,stats:r.st,total:r.total,changes:r.rows},null,1))}],
   ["ex_csv",function(){dl("sentinel-report.csv","text/csv",VXS.toCSV(r.rows))}],
   ["ex_print",function(){window.print()}]].forEach(function(x){var b=el("button","btn alt sm",t(x[0]));b.type="button";b.onclick=x[1];tb.appendChild(b)});
  drawRows();
}
function col(label,rec){
  var d=el("div");d.appendChild(el("b",null,label));var c=el("code",null,rec&&rec[0]?rec[0]:"—");d.appendChild(c);
  if(rec)d.appendChild(el("span",null,VXS.fmtSize(rec[1])+" · "+fdate(rec[2])));return d;
}
function drawRows(){
  var r=lastRes,box=$("rows");box.textContent="";if(!r)return;
  var ql=q.trim().toLowerCase(),list=r.rows.filter(function(x){
    if(filter==="risk"&&!x.f.length)return false;if(filter!=="all"&&filter!=="risk"&&x.t!==filter)return false;
    return !ql||x.p.toLowerCase().indexOf(ql)>-1;
  });
  if(!list.length){box.appendChild(el("p",null,t("none")));box.lastChild.style.color="var(--muted)";return}
  list.slice(0,MAXROWS).forEach(function(x){
    var d=el("details","rw"),s=el("summary");
    s.appendChild(el("span","bd "+x.t,t("t_"+x.t)));s.appendChild(el("span","pth",x.p));
    x.f.forEach(function(f){s.appendChild(el("span","fg",t("fl_"+f)))});d.appendChild(s);
    var b=el("div","dt");b.appendChild(col(t("old"),x.a));b.appendChild(col(t("new"),x.b));d.appendChild(b);box.appendChild(d);
  });
  if(list.length>MAXROWS){var m=el("p",null,"+"+(list.length-MAXROWS)+" "+t("more"));m.style.color="var(--muted)";box.appendChild(m)}
}

/* ---------- checksum verifier ---------- */
async function hashOne(f){
  var out=$("ckout");out.textContent="…";
  if(f.size>268435456){out.textContent=t("ck_big");return}
  if(!(window.crypto&&crypto.subtle)){out.textContent=t("e_api");return}
  var buf=await f.arrayBuffer();ckHashes={};
  for(var a of ["SHA-1","SHA-256","SHA-384","SHA-512"])ckHashes[a]=await VXS.digest(buf,a);
  ckHashes._name=f.name+" · "+VXS.fmtSize(f.size);renderCk();
}
function renderCk(){
  var out=$("ckout");out.textContent="";if(!ckHashes)return;
  var h=el("b",null,ckHashes._name);h.style.cssText="display:block;direction:ltr;text-align:start;word-break:break-all";out.appendChild(h);
  ["SHA-1","SHA-256","SHA-384","SHA-512"].forEach(function(a){
    var row=el("div","hv"),lab=el("span",null,a),c=el("code",null,ckHashes[a]),b=el("button","btn alt sm",t("copy"));b.type="button";
    b.onclick=function(){try{navigator.clipboard.writeText(ckHashes[a]);b.textContent=t("copied");setTimeout(function(){b.textContent=t("copy")},1200)}catch(e){}};
    row.appendChild(lab);row.appendChild(c);row.appendChild(b);out.appendChild(row);
  });
  var ex=$("ckx").value.replace(/[^0-9a-f]/gi,"").toLowerCase();
  if(ex.length){var ok=["SHA-1","SHA-256","SHA-384","SHA-512"].some(function(a){return ckHashes[a]===ex});out.appendChild(el("div","ok "+(ok?"y":"n"),t(ok?"ck_ok":"ck_bad")))}
}

/* ---------- language / theme ---------- */
function setLang(l,save){
  if(!U[l])l="en";lang=l;var d=document.documentElement;d.lang=l;d.dir=l==="ar"?"rtl":"ltr";document.title=t("title");
  var md=document.querySelector('meta[name="description"]');if(md)md.content=t("desc");
  [].forEach.call(document.querySelectorAll("[data-i]"),function(e){e.textContent=t(e.getAttribute("data-i"))});
  [].forEach.call(document.querySelectorAll("[data-ph]"),function(e){e.placeholder=t(e.getAttribute("data-ph"))});
  $("ft").textContent=t("ft");$("theme").setAttribute("aria-label",t("th"));
  [].forEach.call(document.querySelectorAll("#seg button"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-l")===l))});
  renderBases();setPending(pending);if(lastRes)renderResult();renderCk();
  if(save)put("vx-lang",l);
}
function curTheme(){var a=document.documentElement.getAttribute("data-theme");if(THEMES.indexOf(a)>-1)return a;return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function setTheme(m){document.documentElement.setAttribute("data-theme",m);$("theme").textContent=ICON[m];put("vx-theme",m)}

/* ---------- wiring ---------- */
[].forEach.call(document.querySelectorAll("#seg button"),function(b){b.onclick=function(){setLang(b.getAttribute("data-l"),true)}});
$("theme").onclick=function(){setTheme(THEMES[(THEMES.indexOf(curTheme())+1)%4])};
[].forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){setTab(b.getAttribute("data-tab"))}});
[].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){if(!busy)setMode(b.getAttribute("data-mode"))}});
$("pf").onclick=function(){$("fdir").click()};$("pfl").onclick=function(){$("ffiles").click()};
$("fdir").onchange=function(){setPending(fromInput(this.files));this.value=""};
$("ffiles").onchange=function(){setPending(fromInput(this.files));this.value=""};
function dnd(box,onfiles){
  ["dragenter","dragover"].forEach(function(ev){box.addEventListener(ev,function(e){e.preventDefault();box.classList.add("over")})});
  ["dragleave","drop"].forEach(function(ev){box.addEventListener(ev,function(e){e.preventDefault();box.classList.remove("over")})});
  box.addEventListener("drop",function(e){onfiles(e.dataTransfer)});
}
dnd($("dz"),async function(dt){if(!busy)setPending(await fromDrop(dt))});
dnd($("dz2"),function(dt){if(dt.files&&dt.files[0])hashOne(dt.files[0])});
$("ckp").onclick=function(){$("ckf").click()};$("ckf").onchange=function(){if(this.files[0])hashOne(this.files[0]);this.value=""};
$("ckx").oninput=renderCk;
$("go2").onclick=start;$("stop").onclick=function(){stopFlag=true};
$("expb").onclick=function(){if(lastBase)dl("sentinel-baseline-"+lastBase.name.replace(/[^\w.-]+/g,"_")+".json","application/json",JSON.stringify(lastBase))};
$("nowv").onclick=function(){setMode("verify");$("ctl").scrollIntoView({behavior:"smooth",block:"nearest"})};
$("imp").onclick=function(){$("impf").click()};
$("impf").onchange=function(){
  var f=this.files[0];this.value="";if(!f)return;
  f.text().then(function(txt){
    var obj=JSON.parse(txt),u=VXS.unpack(obj),all=loadAll();obj.name=u.name;all[u.name]=obj;
    if(!saveAll(all))say(t("e_save"));renderBases();$("bs").value=u.name;
  }).catch(function(){say(t("e_bad"))});
};
$("delb").onclick=function(){var n=$("bs").value;if(!n||!confirm(t("cdel")))return;var all=loadAll();delete all[n];saveAll(all);renderBases()};

var sl=get("vx-lang");setLang(U[sl]?sl:"en",false);
$("theme").textContent=ICON[curTheme()];setMode("base");setTab("mon");
})();

</script>
